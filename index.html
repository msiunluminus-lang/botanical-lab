<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>잎의 작은 차이 | 잎 표면 구조와 미세먼지 탐구</title>
<meta name="description" content="유민수·정은우의 잎 표면 구조에 따른 미세먼지 흡착률 비교. 15장 과학 탐구 발표와 브라우저 편집기.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header" id="appHeader">
 <a class="brand" href="#1" aria-label="첫 슬라이드로"><span class="brand-icon">↗</span><span>잎의 작은 차이<span class="brand-sub">BOTANICAL LAB</span></span></a>
 <div class="header-divider"></div><span class="project-label">과학 탐구 발표자료</span>
 <div class="header-actions"><span id="saveState" class="save-state" role="status">원본 자료</span><button id="helpBtn" class="icon-btn" title="사용 방법" aria-label="사용 방법">?</button><button id="fileBtn" class="quiet-btn">파일 <span>⌄</span></button><button id="editBtn" class="outline-btn"><span>✎</span> 편집 모드</button><button id="presentBtn" class="primary-btn"><span>▷</span> 발표 시작</button></div>
</header>
<div id="fileMenu" class="popup-menu" hidden><button data-action="save">이 브라우저에 저장 <kbd>Ctrl S</kbd></button><button data-action="export">발표자료 내보내기 (.json)</button><button data-action="import">발표자료 불러오기 (.json)</button><hr><button data-action="original">원본 자료 백업 (.json)</button><button data-action="reset" class="danger">전체를 원본으로 되돌리기</button></div>
<main class="workspace" id="workspace">
 <aside class="slide-rail" id="slideRail"><div class="rail-heading"><span>SLIDES</span><b id="railCount">15</b></div><div id="slideList" class="slide-list" aria-label="슬라이드 목록"></div><div id="slideEditActions" class="slide-edit-actions" hidden><button id="addSlide" class="outline-btn">＋ 슬라이드 추가</button></div><div class="rail-bottom"><span class="status-dot"></span>16:9 PRESENTATION</div></aside>
 <section class="main-stage" aria-label="발표자료">
  <div class="stage-top" id="stageTop"><div><span class="chapter-label" id="chapterLabel">01 — 표지</span><span class="stage-hint" id="stageHint">작은 잎에서 시작한 과학 이야기</span></div><button id="notesBtn" class="text-btn" aria-expanded="false">자료 메모 <span>↗</span></button></div>
  <div class="canvas-viewport" id="canvasViewport"><div class="slide-frame" id="slideFrame"><div id="slideCanvas" class="slide-canvas" tabindex="0" aria-label="현재 슬라이드"></div></div></div>
  <div id="notes" class="notes" hidden></div>
  <nav class="presentation-controls" id="presentationControls" aria-label="발표 컨트롤"><div class="control-left"><button id="hideControls" class="icon-btn" title="컨트롤 숨기기 (H)" aria-label="컨트롤 숨기기">◉</button><span class="keyboard-hint">방향키로 슬라이드 이동</span></div><div class="control-center"><button id="prevBtn" class="nav-btn" aria-label="이전 슬라이드">←</button><span id="slideCounter" class="slide-counter">01 <i>/</i> 15</span><button id="nextBtn" class="nav-btn" aria-label="다음 슬라이드">→</button></div><div class="control-right"><button id="overviewBtn" class="icon-btn" title="슬라이드 목록 표시/숨기기" aria-label="슬라이드 목록 표시 또는 숨기기">▦</button><button id="fullscreenBtn" class="icon-btn" title="전체 화면 (F)" aria-label="전체 화면 전환">⛶</button></div><div class="progress-track"><div id="progressBar"></div></div></nav>
  <div class="stage-footer" id="stageFooter"><span>유민수 · 정은우 <span class="muted">/ 광주중학교</span></span><span>잎 표면 구조에 따른 미세먼지 흡착률 비교</span></div>
 </section>
 <aside id="inspector" class="inspector" hidden aria-label="편집 도구">
  <div class="inspector-title"><b>슬라이드 편집</b><span class="mode-dot">EDIT</span></div>
  <div class="edit-toolbar"><button id="undoBtn" title="실행 취소 (Ctrl Z)">↶</button><button id="redoBtn" title="다시 실행 (Ctrl Y)">↷</button><button id="saveBtn">저장</button><button id="previewBtn">미리보기</button></div>
  <div class="tool-section"><h3>요소 추가</h3><div class="two-cols"><button id="addText" class="outline-btn">T 글자</button><button id="addImage" class="outline-btn">▧ 사진</button></div></div>
  <div id="elementTools" class="tool-section"><p class="empty-selection">슬라이드의 글자, 사진 또는 그래프를 클릭해 편집하세요.</p></div>
  <div class="tool-section"><h3>슬라이드 설정</h3><label>이름<input id="slideName" type="text" maxlength="100"></label><label class="inline-label">배경 색상<input id="slideBg" type="color"></label><div class="two-cols"><button id="duplicateSlide" class="outline-btn">복제</button><button id="deleteSlide" class="outline-btn danger">삭제</button><button id="moveUp" class="outline-btn">↑ 앞으로</button><button id="moveDown" class="outline-btn">↓ 뒤로</button></div><p class="tool-hint">왼쪽 목록을 드래그해 순서를 바꿀 수도 있어요.</p></div>
  <div class="inspector-bottom"><button id="finishEdit" class="primary-btn">편집 완료</button><button id="cancelEdit" class="text-btn">이번 편집 취소</button></div>
 </aside>
</main>
<div id="presentationHint" class="presentation-hint" hidden>← → 이동 · H 컨트롤 · F 전체 화면 · Esc 발표 종료</div>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="modal"><form method="dialog"><div id="modalContent"></div><div class="modal-actions"><button id="modalCancel" value="cancel" class="outline-btn">취소</button><button id="modalConfirm" value="confirm" class="primary-btn">확인</button></div></form></dialog>
<input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden><input type="file" id="jsonInput" accept=".json,application/json" hidden>
<script src="slides.js"></script><script src="app.js"></script>
</body></html>
